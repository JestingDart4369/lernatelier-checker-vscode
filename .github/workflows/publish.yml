# Publishes to the Visual Studio Marketplace when main gets a new version.
# Uses Marketplace Trusted Publishing (OIDC): no token is stored in the repository.
# The Marketplace policy must name: owner JestingDart4369, repository lernatelier-checker-vscode,
# workflow publish.yml, environment marketplace.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: write   # create the version tag and GitHub release
      id-token: write   # Trusted Publishing to the Marketplace
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Is this version new?
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Version $v is already released, nothing to publish."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install and test
        if: steps.version.outputs.new == 'true'
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Package VSIX
        if: steps.version.outputs.new == 'true'
        run: npx --yes @vscode/vsce@4.1.0 package --out "lernatelier-checker-${{ steps.version.outputs.version }}.vsix"

      - name: Publish to the Marketplace
        if: steps.version.outputs.new == 'true'
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath "lernatelier-checker-${{ steps.version.outputs.version }}.vsix"

      - name: Tag and GitHub release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v="${{ steps.version.outputs.version }}"
          notes=$(awk -v v="## $v" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          gh release create "v$v" "lernatelier-checker-$v.vsix" --target "${GITHUB_SHA}" \
            --title "Lernatelier Checker $v" --notes "${notes:-See CHANGELOG.md.}"
